{% extends "base.html" %}
{% block content %}
  <h2>Checkout</h2>
  <div style="display:flex; gap:32px; flex-wrap:wrap;">
    <form class="checkout-form" method="post" action="{{ url_for('checkout') }}">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" value="{{ name }}" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" value="{{ phone }}" placeholder="10-digit mobile number" required>

      <label for="address">Delivery Address</label>
      <textarea id="address" name="address" rows="4" required>{{ address }}</textarea>

      <button class="btn-gold" type="submit" style="margin-top:20px; width:100%;">Continue to Payment</button>
    </form>

    <div class="order-summary" style="flex:1; min-width:260px;">
      <h3>Order Summary</h3>
      {% for item in items %}
        <div class="row">
          <span class="product-cell">
            <img class="thumb" src="{{ url_for('static', filename='images/' ~ item.image) }}" alt="">
            {{ item.name }} ({{ item.quantity_label }}) x {{ item.qty }}
          </span>
          <span>Rs. {{ item.line_total }}</span>
        </div>
      {% endfor %}
      <div class="row total-row">
        <span>Total</span>
        <span>Rs. {{ total }}</span>
      </div>
    </div>
  </div>
{% endblock %}
