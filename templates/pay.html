{% extends "base.html" %}
{% block content %}
  <h2>Complete Your Payment</h2>
  <p>Order total: <strong>Rs. {{ amount_paise // 100 }}</strong></p>
  <p>Click the button below to pay securely via Razorpay.</p>
  <button id="pay-btn" class="btn-gold">Pay Now</button>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    document.getElementById("pay-btn").onclick = function (e) {
      e.preventDefault();
      var options = {
        key: {{ razorpay_key_id | tojson }},
        amount: {{ amount_paise | tojson }},
        currency: "INR",
        name: "Luxury Tree Nuts & Dry Fruits",
        description: "Order #{{ order_id }}",
        order_id: {{ razorpay_order_id | tojson }},
        prefill: {
          name: {{ name | tojson }},
          contact: {{ phone | tojson }}
        },
        notes: {
          address: {{ address | tojson }}
        },
        theme: {
          color: "#5c3a21"
        },
        handler: function (response) {
          var form = document.createElement("form");
          form.method = "POST";
          form.action = "{{ url_for('verify_payment') }}";

          var fields = {
            order_id: {{ order_id | tojson }},
            razorpay_order_id: response.razorpay_order_id,
            razorpay_payment_id: response.razorpay_payment_id,
            razorpay_signature: response.razorpay_signature
          };

          for (var key in fields) {
            var input = document.createElement("input");
            input.type = "hidden";
            input.name = key;
            input.value = fields[key];
            form.appendChild(input);
          }

          document.body.appendChild(form);

          fetch(form.action, {
            method: "POST",
            body: new FormData(form)
          })
            .then(function (res) { return res.json(); })
            .then(function (data) {
              if (data.status === "success") {
                window.location.href = data.redirect;
              } else {
                alert("Payment verification failed: " + data.message);
              }
            });
        },
        modal: {
          ondismiss: function () {
            alert("Payment was cancelled.");
          }
        }
      };
      var rzp = new Razorpay(options);
      rzp.open();
    };
  </script>
{% endblock %}
